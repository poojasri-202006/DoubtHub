<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoubtHub | Explore Doubts</title>
    <link rel="stylesheet" href="dashboard.css">
    <script src="dashboard-auth.js" defer></script>
</head>
<body data-role="student">

<nav class="topbar">
    <a href="studentDashboard.html" class="brand">DoubtHub<span>.</span></a>
    <div class="top-links">
        <a href="studentDashboard.html">Dashboard</a>
        <a href="postDoubt.html">Ask a Doubt</a>
        <a href="viewDoubts.html" class="active">Explore Doubts</a>
        <a href="index.html" id="logoutLink">Logout</a>
    </div>
</nav>

<main class="page-container">
    <p class="eyebrow">CLASSROOM DISCUSSIONS</p>
    <h1 class="page-title">Explore and understand.</h1>
    <p class="page-subtitle">
        Learn from questions asked by your classmates and share what you know.
    </p>

    <input type="search" id="searchDoubts" class="search-input"
           placeholder="Search doubts by topic or question...">

    <div class="section-heading">
        <h2>Recent doubts</h2>
        <span class="badge" id="classInfo">Your class</span>
    </div>

    <div id="doubtList"></div>
</main>

<footer class="footer">© 2026 DoubtHub · Learn · Share · Grow</footer>

<script>
const authToken = sessionStorage.getItem("doubthubToken");
const list = document.getElementById("doubtList");

function esc(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

async function loadDoubts() {
    const res = await fetch("/api/doubts", {
        headers: { Authorization: "Bearer " + authToken }
    });
    const doubts = await res.json();

    if (!res.ok) {
        list.innerHTML = '<p class="empty-note">' + esc(doubts.message) + '</p>';
        return;
    }
    if (doubts.length === 0) {
        list.innerHTML = '<p class="empty-note">No doubts yet. Be the first to ask!</p>';
        return;
    }

    list.innerHTML = doubts.map(function (d) {
        const answers = d.answers.map(function (a) {
            return '<div class="answer-box">' +
                '<p>' + esc(a.text) + '</p>' +
                '<button type="button" class="btn btn-outline btn-small like-btn" ' +
                'data-doubt="' + d._id + '" data-answer="' + a._id + '">♡ Like ' +
                '<span class="likes">' + a.likes + '</span></button></div>';
        }).join("");

        return '<article class="card question-card">' +
            '<span class="badge">' + esc(d.course) + '</span>' +
            '<h3>' + esc(d.title) + '</h3>' +
            '<div class="question-meta"><span>Course code: ' + esc(d.courseCode) + '</span>' +
            '<span>•</span><span>' + d.answers.length + ' answers</span></div>' +
            '<p>' + esc(d.description) + '</p>' + answers +
            '<div class="form-group" style="margin-top:20px">' +
            '<label>Your answer</label><textarea placeholder="Share your explanation..."></textarea></div>' +
            '<button type="button" class="btn answer-btn" data-doubt="' + d._id + '">Submit Answer</button>' +
            '<p class="form-note answer-message" aria-live="polite"></p></article>';
    }).join("");
}

list.addEventListener("click", async function (event) {
    const likeBtn = event.target.closest(".like-btn");
    const answerBtn = event.target.closest(".answer-btn");

    if (likeBtn) {
        const res = await fetch("/api/doubts/" + likeBtn.dataset.doubt +
            "/answers/" + likeBtn.dataset.answer + "/like", {
            method: "POST",
            headers: { Authorization: "Bearer " + authToken }
        });
        const data = await res.json();
        if (res.ok) {
            likeBtn.querySelector(".likes").textContent = data.likes;
            likeBtn.disabled = true;
        }
    }

    if (answerBtn) {
        const card = answerBtn.closest(".question-card");
        const text = card.querySelector("textarea").value.trim();
        const msg = card.querySelector(".answer-message");
        if (!text) { msg.textContent = "Please enter your answer first."; return; }

        const res = await fetch("/api/doubts/" + answerBtn.dataset.doubt + "/answers", {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: "Bearer " + authToken },
            body: JSON.stringify({ text: text })
        });
        if (res.ok) { loadDoubts(); } else { msg.textContent = "Could not save answer."; }
    }
});

document.getElementById("searchDoubts").addEventListener("input", function () {
    const q = this.value.toLowerCase();
    document.querySelectorAll("#doubtList .question-card").forEach(function (card) {
        card.style.display = card.textContent.toLowerCase().includes(q) ? "block" : "none";
    });
});

loadDoubts();
</script>

</body>
</html>
