
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoubtHub | Change Password</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #263746;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 420px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 15px #00000012;
        }

        h2 {
            margin-bottom: 10px;
        }

        p {
            color: #718096;
            line-height: 1.5;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dce1e5;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #172c35;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
        }

        .error {
            color: #d33b3b;
        }

        .success {
            color: #16834b;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Change Your Password</h2>

        <p>
            Your Admin has provided a temporary password.
            Please create your own password before continuing to DoubtHub.
        </p>

        <form id="passwordForm">

            <label for="currentPassword">
                Temporary Password
            </label>

            <input type="password"
                   id="currentPassword"
                   required
                   autocomplete="current-password">

            <label for="newPassword">
                New Password
            </label>

            <input type="password"
                   id="newPassword"
                   minlength="8"
                   required
                   autocomplete="new-password">

            <label for="confirmPassword">
                Confirm New Password
            </label>

            <input type="password"
                   id="confirmPassword"
                   minlength="8"
                   required
                   autocomplete="new-password">

            <button type="submit" id="changeBtn">
                Change Password
            </button>

            <div id="message" aria-live="polite"></div>

        </form>

    </div>

    <script>
        const token = sessionStorage.getItem("doubthubToken");

        const user = JSON.parse(
            sessionStorage.getItem("doubthubUser") || "null"
        );

        if (!token || !user || user.mustChangePassword !== true) {
            window.location.href = "index.html";
        }

        const passwordForm = document.getElementById("passwordForm");
        const message = document.getElementById("message");
        const changeBtn = document.getElementById("changeBtn");

        passwordForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const currentPassword =
                document.getElementById("currentPassword").value;

            const newPassword =
                document.getElementById("newPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            message.textContent = "";
            message.className = "";

            if (newPassword.length < 8) {
                message.textContent =
                    "New password must contain at least 8 characters.";
                message.className = "error";
                return;
            }

            if (newPassword !== confirmPassword) {
                message.textContent =
                    "New passwords do not match.";
                message.className = "error";
                return;
            }

            try {
                changeBtn.disabled = true;
                changeBtn.textContent = "Updating...";

                const response = await fetch(
                    "/api/auth/change-password",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": "Bearer " + token
                        },
                        body: JSON.stringify({
                            currentPassword,
                            newPassword
                        })
                    }
                );

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.message || "Password change failed."
                    );
                }

                message.textContent =
                    "Password changed successfully! Please sign in again.";

                message.className = "success";

                sessionStorage.removeItem("doubthubToken");
                sessionStorage.removeItem("doubthubUser");

                passwordForm.reset();

                setTimeout(function() {
                    window.location.href = "index.html";
                }, 1800);

            } catch (error) {
                message.textContent = error.message;
                message.className = "error";

            } finally {
                changeBtn.disabled = false;
                changeBtn.textContent = "Change Password";
            }
        });
    </script>

</body>
</html>
